name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every compiler and build type. gcc-release is the one preset that builds
  # with -Werror, so warnings are enforced in exactly one place rather than
  # tripping the whole matrix over a compiler-specific diagnostic.
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # gcc-release is the hardened profile; gcc-fast and gcc-paranoid are
        # the same build with MARS_PROFILE changed. All three carry -Werror,
        # because a profile that only compiles with warnings is not a profile
        # anyone can ship.
        #
        # gcc-nolock is the same build with the lock compiled out. It is here
        # because it is what the cost of the lock is measured against, and a
        # configuration nobody builds is a configuration that stops compiling
        # without anyone noticing.
        preset: [gcc-debug, gcc-release, gcc-fast, gcc-paranoid,
                 gcc-nolock, clang-debug, clang-release]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: asan + ubsan / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-asan-ubsan, gcc-asan-fast, gcc-asan-paranoid]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Fuzz
        run: ./build/${{ matrix.preset }}/bin/fuzz_shadow --seconds 60

  # ThreadSanitizer, over the core only.
  #
  # **A separate job because TSan and ASan cannot be combined.** Both replace
  # parts of the runtime and neither tolerates the other, so this is not a
  # matrix entry of the sanitizers job above -- it is its own build.
  #
  # **And never over the preload shim.** TSan interposes malloc exactly as ASan
  # does, so a build containing both is one where which allocator runs is a
  # link-order accident. CMakeLists.txt does not build the shim under any
  # sanitizer, which is what makes that a property of the build rather than a
  # rule someone has to remember here.
  #
  # The last step is the control. A sanitizer job that passes says nothing
  # unless the same job would fail on code that is actually racy, so the same
  # tests are built once more with the lock compiled out, and this job fails if
  # ThreadSanitizer does *not* report a race there.
  thread-sanitizer:
    name: thread sanitizer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      # TSan lays its shadow memory over a fixed part of the address space and
      # refuses to start when ASLR has put something there first. Kernels since
      # 6.x randomise across 32 bits by default, which is more entropy than
      # TSan's mapping can survive; 28 is the value its own documentation asks
      # for. Without this the job fails with "unexpected memory mapping" before
      # running a single test.
      - name: Make room for TSan's shadow mapping
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset gcc-tsan
      - name: Build
        run: cmake --build --preset gcc-tsan -- -j$(nproc)
      - name: Test
        run: ctest --preset gcc-tsan

      - name: The same tests without the lock must be reported as racy
        run: |
          set -e
          cmake -S . -B build/tsan-nolock -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug \
            -DMARS_SANITIZE=thread -DMARS_LOCK=none
          cmake --build build/tsan-nolock -j$(nproc)
          cat > racer.c <<'EOF'
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include "mars/allocator.h"
          static void *w(void *a) {
            (void)a;
            for (int i = 0; i < 20000; i++) {
              void *p = mm_malloc(64);
              if (p != NULL) mm_free(p);
            }
            return NULL;
          }
          int main(void) {
            size_t n = 8u << 20;
            void *heap = malloc(n);
            if (heap == NULL || mm_init(heap, n) != 0) return 2;
            pthread_t t[4];
            for (int i = 0; i < 4; i++) pthread_create(&t[i], NULL, w, NULL);
            for (int i = 0; i < 4; i++) pthread_join(t[i], NULL);
            printf("check_heap: %d\n", (int)mm_check_heap());
            return 0;
          }
          EOF
          gcc -fsanitize=thread -g -O1 -std=c11 -Iinclude -o racer racer.c \
            -Lbuild/tsan-nolock/bin -lmars \
            -Wl,-rpath,$PWD/build/tsan-nolock/bin -pthread
          ./racer > /dev/null 2> racer.err || true
          races=$(grep -c 'WARNING: ThreadSanitizer: data race' racer.err || true)
          echo "races reported without the lock: $races"
          head -20 racer.err
          [ "$races" -gt 0 ] || {
            echo "FAIL: the unlocked allocator was not reported as racy, so the"
            echo "green run above is not evidence of anything"; exit 1; }

      # And the shim built that way has to say so. The warning is not decoration
      # -- it is the only thing standing between somebody who built with
      # MARS_LOCK=none and a corrupted heap in a program that has nothing to do
      # with this project.
      - name: The shim built without locking warns about threads
        run: |
          set -e
          cmake -S . -B build/nolock-shim -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release \
            -DMARS_LOCK=none
          cmake --build build/nolock-shim -j$(nproc) --target mars_preload
          cat > tiny.c <<'EOF'
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>
          static void *w(void *a) {
            (void)a;
            for (int i = 0; i < 64; i++) free(malloc(64));
            return NULL;
          }
          int main(void) {
            pthread_t t;
            if (pthread_create(&t, 0, w, 0)) return 1;
            pthread_join(t, 0);
            printf("ran\n");
            return 0;
          }
          EOF
          gcc -O1 -pthread -o tiny tiny.c
          LD_PRELOAD=$PWD/build/nolock-shim/bin/libmars_preload.so ./tiny \
            2> tiny.err || true
          cat tiny.err
          grep -q 'MARS_LOCK=none' tiny.err || {
            echo "FAIL: a build with no locking did not warn about threads"
            exit 1; }
          echo "ok: the build that is unsafe under threads says so"

  valgrind:
    name: valgrind / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-debug-fast, gcc-debug-paranoid]
    steps:
      - uses: actions/checkout@v5
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      # test_shim is skipped, and it is not an oversight. Valgrind redirects
      # malloc for *any* object that defines one, not only for libc, so under
      # memcheck the preload shim is linked in and never called -- the test
      # would be exercising valgrind's allocator and reporting on ours. It is
      # the same interception that keeps the shim out of ASan builds. The
      # allocator underneath is checked here through every other binary.
      - name: Memcheck the test binaries
        run: |
          set -e
          for t in build/${{ matrix.preset }}/bin/test_*; do
            case "$t" in *test_shim) echo "== $t (skipped: valgrind replaces malloc)"; continue;; esac
            echo "== $t"
            valgrind -q --error-exitcode=1 --leak-check=full \
                     --errors-for-leak-kinds=all "$t"
          done
      - name: Memcheck the fuzzer
        run: |
          valgrind -q --error-exitcode=1 --leak-check=full \
            ./build/${{ matrix.preset }}/bin/fuzz_shadow --seed 20260809 --ops 6000

  # Replays fixed seeds so a failure found here is reproducible verbatim, then
  # spends a little time on a fresh one to keep finding new ground.
  fuzz:
    name: fuzz
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset gcc-release
      - name: Build
        run: cmake --build --preset gcc-release -- -j$(nproc)
      - name: Replay known seeds
        run: |
          set -e
          for s in 1 2 3 7 42 1337 99991 20260809; do
            ./build/gcc-release/bin/fuzz_shadow --seed "$s" --ops 100000
          done
      - name: Explore a new seed
        run: ./build/gcc-release/bin/fuzz_shadow --seconds 90

  # A sweep large enough to have a chance of catching a rare arena-promise
  # failure, not merely the classifier or the injector breaking.
  #
  # It used to be 200 trials per cell. That was too small on its own terms: the
  # defect this gate exists to catch turned out to occur twice in 240,000 trials
  # under `fast`, and a 200-trial sweep could not have seen it in the lifetime of
  # the project. 2,000 per cell is 56,000 trials per profile and costs well under
  # a minute, since a trial is a fork and a few thousand allocator calls.
  #
  # Enlarging it is still not the main defence. A sweep only ever catches a
  # 1-in-100,000 event with some probability; replaying the exact trials that
  # found one catches it every time, which is why the two seeds are ctest cases
  # in the build matrix rather than a bigger number here.
  #
  # Statistically meaningful *measurements* are still taken deliberately: the
  # committed CSVs are a 10,000-trial matrix, and that is what a reported
  # detection rate comes from.
  fault-injection:
    name: fault injection / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: gcc-release   # hardened
            checksum: 'yes'
          - preset: gcc-fast
            checksum: 'no'
          - preset: gcc-paranoid
            checksum: 'yes'
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Inject
        run: |
          ./build/${{ matrix.preset }}/bin/faultinject \
            --trials 2000 --bits 1,2,4,8 \
            --git-sha "$(git rev-parse --short HEAD)" \
            --csv faults.csv
        # Deliberately without --fail-on-crash: the check below gates the same
        # thing and prints the offending row, which an exit code cannot. The flag
        # is for the seeded replays in ctest, where there is no CSV to read.
      - name: Check the results against what the profile promises
        env:
          HAS_CHECKSUM: ${{ matrix.checksum }}
        # Two different promises. Every profile promises never to leave the
        # arena -- a crash is a defect under all of them. Only a profile with a
        # checksum promises detection, and there the single-bit header cell is
        # decidable from theory: a CRC over the header catches every one, so
        # anything below 100% is a defect and not a statistic.
        #
        # The fast profile is measured too, and its numbers are recorded rather
        # than gated. Leaving it out would hide the cost of the trade instead
        # of pricing it.
        run: |
          python3 - <<'PY'
          import csv, os, sys
          # The provenance block is `#` comment lines above the real header.
          body = [l for l in open('faults.csv') if not l.startswith('#')]
          rows = list(csv.DictReader(body))
          if not rows:
              sys.exit('faultinject produced no rows')
          bad = []
          for r in rows:
              if int(r['crash']) != 0:
                  bad.append(('crash', r))
          if os.environ['HAS_CHECKSUM'] == 'yes':
              for r in rows:
                  if r['target'] == 'alloc_hdr' and r['bits'] == '1':
                      if float(r['detection_pct']) < 100.0 or int(r['undetected_silent']) != 0:
                          bad.append(('single-bit header', r))
          if bad:
              for why, r in bad:
                  print(why, '->', r)
              sys.exit(1)
          silent = sum(int(r['undetected_silent']) for r in rows)
          print('profile', rows[0]['profile'], 'ok;', silent, 'silent cases recorded')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-injection-${{ matrix.preset }}
          path: faults.csv

  # The README's numbers are the project's whole claim, and a claim that has
  # drifted from the measurement behind it is worse than no claim at all. This
  # gate holds every number in it against the committed CSVs, the headers, or a
  # short list of definitions -- and fails on a `__` placeholder, which is what
  # a table laid out and never filled in looks like.
  #
  # docs/RESULTS.md is checked the same way round: it is generated, so it has to
  # be regenerated when the CSVs change rather than edited to match them.
  readme-numbers:
    name: numbers trace to a CSV
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Check the README against bench/results/
        run: python3 tools/check_readme_numbers.py
      - name: Check docs/RESULTS.md is regenerated
        run: python3 tools/report.py --check

  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      # From apt rather than pip: this pins the same gcovr the development
      # environment has, so a coverage number cannot differ between the two.
      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Configure
        run: cmake --preset gcc-coverage
      - name: Build
        run: cmake --build --preset gcc-coverage -- -j$(nproc)
      - name: Test
        run: ctest --preset gcc-coverage
      # Gated, not merely reported: a number nobody enforces drifts downwards.
      #
      # The filter is `src/`, so **shim/mm_shim.c is not covered by this gate**.
      # It is not built under coverage at all: the preload library compiles the
      # `src/` sources a second time, and a second set of counters over the same
      # files would be folded into this number as though the shim's copy were
      # the library's. The shim is covered instead by tests/test_shim.c in the
      # ordinary builds and by the preload job below, which runs real programs
      # through it.
      - name: Report
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'src/' \
                --html-details coverage/index.html \
                --txt --print-summary \
                --fail-under-line 90
      # Uploaded even when the gate fails -- that is precisely when someone
      # needs to look at which lines stopped being covered.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # The claim this whole phase exists to support: the allocator runs software
  # nobody wrote for it, produces the same answers, and leaves a consistent
  # heap. A microbenchmark cannot say any of that -- the person who chose its
  # allocation pattern also wrote the allocator.
  #
  # Correctness first and timings second. tools/preload_bench.py takes the
  # committed timings deliberately, on a pinned core; a shared CI runner is not
  # a machine anyone should quote a wall time from, so this job checks that the
  # programs are *right* and leaves the numbers to bench/results/.
  preload:
    name: preload / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-release, gcc-fast, gcc-paranoid]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)

      # Bootstrap is the first thing that can go wrong and the loudest: dlsym
      # allocates, so an allocator that has not solved that starts nothing at
      # all. If this step passes, the bootstrap pool works.
      - name: The shim loads at all
        run: |
          set -e
          SO=$PWD/build/${{ matrix.preset }}/bin/libmars_preload.so
          LD_PRELOAD=$SO /bin/true
          LD_PRELOAD=$SO /bin/echo bootstrap ok

      - name: Real programs produce identical output
        run: |
          set -e
          SO=$PWD/build/${{ matrix.preset }}/bin/libmars_preload.so
          LOG=$PWD/heapcheck.log
          : > "$LOG"
          fail=0
          run_both() {
            name="$1"; shift
            "$@" > base.out 2> /dev/null; rc_base=$?
            LD_PRELOAD=$SO MARS_SHIM_CHECK=$LOG "$@" > shim.out 2> /dev/null; rc_shim=$?
            if [ "$rc_base" != "$rc_shim" ]; then
              echo "FAIL $name: exit $rc_base vs $rc_shim"; fail=1; return
            fi
            if ! cmp -s base.out shim.out; then
              echo "FAIL $name: output differs"; diff base.out shim.out | head -5; fail=1; return
            fi
            echo "ok   $name (exit $rc_base, $(wc -c < shim.out) bytes)"
          }
          run_both "ls -laR"        ls -laR /usr/include
          run_both "git status"     git status --porcelain
          run_both "git log --stat" git log --stat -n 100
          run_both "grep -r"        grep -rc allocator src docs tests
          run_both "python sum"     python3 -c "print(sum(range(10**6)))"
          run_both "python dict"    python3 -c "d={str(i):i*i for i in range(200000)}; print(len(d), sum(d.values()))"
          run_both "gcc compile"    gcc -O2 -std=c11 -c src/mm_core.c -Iinclude -Isrc -o /tmp/o.o
          run_both "sort"           bash -c "seq 1 200000 | sort -n | md5sum"

          echo "heap checks passed:      $(grep -c 'heap consistent at exit' "$LOG")"
          echo "heap checks failed:      $(grep -c 'INCONSISTENT' "$LOG")"
          [ "$(grep -c 'INCONSISTENT' "$LOG")" = "0" ] || fail=1
          [ "$(grep -c 'heap consistent at exit' "$LOG")" != "0" ] || {
            echo "FAIL: no run reported a heap check"; fail=1; }
          exit $fail

      # fork is the case a copy-on-write arena has to survive, and threads are
      # the case that used to be checked for a warning rather than an outcome.
      # It is checked for the outcome now: the allocator gives each thread its
      # own arena, so a threaded program under the shim has to *work* and has to
      # leave a consistent heap, and the shim has to have stopped warning about
      # something that is no longer true.
      - name: fork, and threads
        run: |
          set -e
          SO=$PWD/build/${{ matrix.preset }}/bin/libmars_preload.so
          cat > forker.c <<'EOF'
          #include <stdlib.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/wait.h>
          #include <unistd.h>
          int main(void) {
            void *pre[32];
            for (int i = 0; i < 32; i++) { pre[i] = malloc(4096); memset(pre[i], i, 4096); }
            pid_t pid = fork();
            if (pid < 0) return 1;
            for (int r = 0; r < 100; r++) {
              void *p[16];
              for (int i = 0; i < 16; i++) { p[i] = calloc(1, 8192); if (!p[i]) return 2; }
              for (int i = 0; i < 16; i++) free(p[i]);
            }
            for (int i = 0; i < 32; i++) {
              unsigned char *q = pre[i];
              for (int j = 0; j < 4096; j++) if (q[j] != (unsigned char)i) return 3;
              free(pre[i]);
            }
            if (pid == 0) _exit(0);
            int st = 0; waitpid(pid, &st, 0);
            if (!WIFEXITED(st) || WEXITSTATUS(st) != 0) return 4;
            printf("fork ok\n");
            return 0;
          }
          EOF
          gcc -O1 -o forker forker.c
          LD_PRELOAD=$SO MARS_SHIM_CHECK=1 ./forker

          # Eight threads each minding their own blocks, then a pair that hands
          # every block from one thread to another -- the case that needs the
          # remote-free queue, and the case a naive per-thread arena gets wrong.
          cat > threaded.c <<'EOF'
          #include <pthread.h>
          #include <stdlib.h>
          #include <stdio.h>
          #include <string.h>
          #define T 8
          static void *own(void *a) {
            (void)a;
            void *held[64];
            memset(held, 0, sizeof(held));
            for (int i = 0; i < 20000; i++) {
              int s = i % 64;
              free(held[s]);
              held[s] = malloc(1 + (unsigned)(i * 37) % 900);
              if (held[s] == NULL) return (void *)1;
              memset(held[s], i & 0xFF, 1);
            }
            for (int i = 0; i < 64; i++) free(held[i]);
            return NULL;
          }
          static void *handoff[4096];
          static void *maker(void *a) {
            (void)a;
            for (int i = 0; i < 4096; i++)
              if ((handoff[i] = calloc(1, 128)) == NULL) return (void *)1;
            return NULL;
          }
          static void *taker(void *a) {
            (void)a;
            for (int i = 0; i < 4096; i++) {
              char *p = realloc(handoff[i], 256);
              if (p == NULL) return (void *)1;
              free(p);
            }
            return NULL;
          }
          int main(void) {
            pthread_t t[T]; void *r;
            for (int i = 0; i < T; i++)
              if (pthread_create(&t[i], 0, own, 0)) return 1;
            for (int i = 0; i < T; i++) { pthread_join(t[i], &r); if (r) return 2; }
            pthread_t m, k;
            if (pthread_create(&m, 0, maker, 0)) return 1;
            pthread_join(m, &r); if (r) return 3;
            if (pthread_create(&k, 0, taker, 0)) return 1;
            pthread_join(k, &r); if (r) return 4;
            printf("threads ok\n");
            return 0;
          }
          EOF
          gcc -O1 -pthread -o threaded threaded.c
          : > thread.log
          LD_PRELOAD=$SO MARS_SHIM_CHECK=$PWD/thread.log ./threaded > thread.out 2> thread.err
          cat thread.err
          grep -q 'threads ok' thread.out || {
            echo "FAIL: the threaded program did not finish"; exit 1; }
          grep -q 'heap consistent at exit' thread.log || {
            echo "FAIL: no consistent heap after a threaded run"; cat thread.log; exit 1; }
          # The warning belongs to MARS_LOCK=none and nowhere else. A shim that
          # still says its heap is unsafe under threads would be lying, and a
          # stale warning is worse than none: it teaches people to ignore them.
          grep -q 'not safe under' thread.err && {
            echo "FAIL: the shim still warns about threads it now supports"
            exit 1; }
          echo "ok: a threaded program ran, left a consistent heap, and was not warned at"

      # A bit flipped in a real program's heap, and what each profile does
      # about it. The profile decides the expectation, which is the point: the
      # `fast` trade is priced rather than gated, and the other two are gated.
      - name: A staged fault inside a real program
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          set -e
          SO=$PWD/build/${{ matrix.preset }}/bin/libmars_preload.so
          PROG='d={str(i):i*i for i in range(50000)}; print(len(d))'

          LD_PRELOAD=$SO MARS_SHIM_CHECK=1 python3 -c "$PROG" > /dev/null 2> clean.err
          if [ -s clean.err ] && grep -qE 'corrupt|inconsistent|INCONSISTENT' clean.err; then
            echo "FAIL: a clean run reported damage"; cat clean.err; exit 1
          fi
          echo "ok: a clean run reports nothing"

          LD_PRELOAD=$SO MARS_SHIM_CHECK=1 MARS_SHIM_FLIP=120 \
            python3 -c "$PROG" > /dev/null 2> flip.err || true
          cat flip.err
          grep -q 'flipped one bit' flip.err || { echo "FAIL: no flip staged"; exit 1; }
          case "$PRESET" in
            gcc-fast)
              # No header checksum under this profile, so detection is not
              # promised. Recorded, not gated -- exactly as the fault matrix
              # treats it.
              echo "note: reports from fast: $(grep -cE 'shim: (free|malloc|realloc|calloc): ' flip.err)"
              ;;
            *)
              grep -qE 'shim: (free|malloc|realloc|calloc): |HEAP INCONSISTENT' flip.err || {
                echo "FAIL: a profile with a checksum did not report the flip"; exit 1; }
              echo "ok: the flip was reported"
              ;;
          esac

  # The core and its tests must stay portable. The preload shim, sanitizers,
  # valgrind and the fault injector are Linux-only by design and are not built
  # here.
  windows:
    name: windows / ucrt64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
