name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every compiler and build type. gcc-release is the one preset that builds
  # with -Werror, so warnings are enforced in exactly one place rather than
  # tripping the whole matrix over a compiler-specific diagnostic.
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # gcc-release is the hardened profile; gcc-fast and gcc-paranoid are
        # the same build with MARS_PROFILE changed. All three carry -Werror,
        # because a profile that only compiles with warnings is not a profile
        # anyone can ship.
        preset: [gcc-debug, gcc-release, gcc-fast, gcc-paranoid,
                 clang-debug, clang-release]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: asan + ubsan / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-asan-ubsan, gcc-asan-fast, gcc-asan-paranoid]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Fuzz
        run: ./build/${{ matrix.preset }}/bin/fuzz_shadow --seconds 60

  valgrind:
    name: valgrind / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-debug-fast, gcc-debug-paranoid]
    steps:
      - uses: actions/checkout@v5
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Memcheck the test binaries
        run: |
          set -e
          for t in build/${{ matrix.preset }}/bin/test_*; do
            echo "== $t"
            valgrind -q --error-exitcode=1 --leak-check=full \
                     --errors-for-leak-kinds=all "$t"
          done
      - name: Memcheck the fuzzer
        run: |
          valgrind -q --error-exitcode=1 --leak-check=full \
            ./build/${{ matrix.preset }}/bin/fuzz_shadow --seed 20260809 --ops 6000

  # Replays fixed seeds so a failure found here is reproducible verbatim, then
  # spends a little time on a fresh one to keep finding new ground.
  fuzz:
    name: fuzz
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset gcc-release
      - name: Build
        run: cmake --build --preset gcc-release -- -j$(nproc)
      - name: Replay known seeds
        run: |
          set -e
          for s in 1 2 3 7 42 1337 99991 20260809; do
            ./build/gcc-release/bin/fuzz_shadow --seed "$s" --ops 100000
          done
      - name: Explore a new seed
        run: ./build/gcc-release/bin/fuzz_shadow --seconds 90

  # A small sweep, enough to catch the classifier or the injector breaking.
  # Statistically meaningful runs are launched deliberately, not per push.
  fault-injection:
    name: fault injection / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: gcc-release   # hardened
            checksum: 'yes'
          - preset: gcc-fast
            checksum: 'no'
          - preset: gcc-paranoid
            checksum: 'yes'
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Inject
        run: |
          ./build/${{ matrix.preset }}/bin/faultinject \
            --trials 200 --bits 1,2 --csv faults.csv
      - name: Check the results against what the profile promises
        env:
          HAS_CHECKSUM: ${{ matrix.checksum }}
        # Two different promises. Every profile promises never to leave the
        # arena -- a crash is a defect under all of them. Only a profile with a
        # checksum promises detection, and there the single-bit header cell is
        # decidable from theory: a CRC over the header catches every one, so
        # anything below 100% is a defect and not a statistic.
        #
        # The fast profile is measured too, and its numbers are recorded rather
        # than gated. Leaving it out would hide the cost of the trade instead
        # of pricing it.
        run: |
          python3 - <<'PY'
          import csv, os, sys
          rows = list(csv.DictReader(open('faults.csv')))
          if not rows:
              sys.exit('faultinject produced no rows')
          bad = []
          for r in rows:
              if int(r['crash']) != 0:
                  bad.append(('crash', r))
          if os.environ['HAS_CHECKSUM'] == 'yes':
              for r in rows:
                  if r['target'] == 'alloc_hdr' and r['bits'] == '1':
                      if float(r['detection_pct']) < 100.0 or int(r['undetected_silent']) != 0:
                          bad.append(('single-bit header', r))
          if bad:
              for why, r in bad:
                  print(why, '->', r)
              sys.exit(1)
          silent = sum(int(r['undetected_silent']) for r in rows)
          print('profile', rows[0]['profile'], 'ok;', silent, 'silent cases recorded')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-injection-${{ matrix.preset }}
          path: faults.csv

  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      # From apt rather than pip: this pins the same gcovr the development
      # environment has, so a coverage number cannot differ between the two.
      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Configure
        run: cmake --preset gcc-coverage
      - name: Build
        run: cmake --build --preset gcc-coverage -- -j$(nproc)
      - name: Test
        run: ctest --preset gcc-coverage
      # Gated, not merely reported: a number nobody enforces drifts downwards.
      - name: Report
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'src/' \
                --html-details coverage/index.html \
                --txt --print-summary \
                --fail-under-line 90
      # Uploaded even when the gate fails -- that is precisely when someone
      # needs to look at which lines stopped being covered.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # The core and its tests must stay portable. The preload shim, sanitizers,
  # valgrind and the fault injector are Linux-only by design and are not built
  # here.
  windows:
    name: windows / ucrt64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
