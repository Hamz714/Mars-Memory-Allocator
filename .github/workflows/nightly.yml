name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # Long fuzzing under instrumentation. Kept out of the per-push workflow so
  # that CI stays fast; anything this finds is reproducible from the seed it
  # prints, which is the whole point of seeding the operation stream.
  soak:
    name: soak / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-asan-ubsan, gcc-release]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Soak
        run: ./build/${{ matrix.preset }}/bin/fuzz_shadow --seconds 900
      - name: Soak a small arena
        run: |
          ./build/${{ matrix.preset }}/bin/fuzz_shadow --seconds 300 --arena 8192
      - name: Soak a large arena
        run: |
          ./build/${{ matrix.preset }}/bin/fuzz_shadow --seconds 300 --arena 16777216

  # The statistically meaningful run: enough trials that a rate carries a
  # confidence interval worth quoting.
  #
  # All three profiles, because the point of having profiles is that they
  # detect different amounts and the difference is the thing being priced.
  # Running only the default would report the best case as if it were the
  # whole story.
  fault-sweep:
    name: fault sweep / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-release, gcc-fast, gcc-paranoid]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Sweep
        run: |
          ./build/${{ matrix.preset }}/bin/faultinject \
            --trials 10000 --bits 1,2,4,8 \
            --git-sha "$(git rev-parse --short HEAD)" --csv faults-full.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-sweep-${{ matrix.preset }}
          path: faults-full.csv

  # The trade the patrol exists to make, priced rather than asserted: how long
  # damage sits unnoticed in memory nobody is touching, as a function of how
  # often the patrol runs. Accumulated into one CSV -- faultinject appends when
  # the file already exists -- so the whole curve is a single artifact.
  #
  # Read `latency_mean_ops` against `latency_n`: the measurement window is
  # 4096 calls per trial, so an interval near or above that censors the mean
  # and only the trials counted in latency_n are in it.
  scrub-sweep:
    name: scrub sweep / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: gcc-release   # hardened
            checksum: 'yes'
          - preset: gcc-fast
            checksum: 'no'
          - preset: gcc-paranoid
            checksum: 'yes'
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Sweep the scrub interval
        run: |
          set -e
          for s in 1 256 1024 4096 off; do
            ./build/${{ matrix.preset }}/bin/faultinject \
              --trials 2000 --bits 1,2 --scrub-interval "$s" \
              --git-sha "$(git rev-parse --short HEAD)" --csv scrub-sweep.csv
          done
      - name: Summarise the curve
        env:
          HAS_CHECKSUM: ${{ matrix.checksum }}
        run: |
          python3 - <<'PY'
          import csv, collections, os
          # The provenance block is `#` comment lines above the real header.
          body = [l for l in open('scrub-sweep.csv') if not l.startswith('#')]
          rows = list(csv.DictReader(body))
          by = collections.defaultdict(list)
          for r in rows:
              by[r['scrub_interval']].append(r)
          print(f"{'interval':>9} {'detected':>9} {'silent':>7} {'lat n':>7} {'mean ops':>10}")
          for k in sorted(by, key=int):
              g = by[k]
              n = sum(int(r['latency_n']) for r in g)
              total = sum(int(r['trials']) for r in g)
              silent = sum(int(r['undetected_silent']) for r in g)
              weighted = sum(float(r['latency_mean_ops']) * int(r['latency_n']) for r in g)
              mean = weighted / n if n else float('nan')
              print(f"{k:>9} {total:>9} {silent:>7} {n:>7} {mean:>10.1f}")
          # Two different promises, as in ci.yml. Never leaving the arena is
          # unconditional, so a crash fails under every profile. Detection is
          # what the metadata buys, so silent corruption is a defect only where
          # a checksum promised to catch it; under `fast` it is a recorded cost
          # of the trade, and the patrol is not what governs it either way.
          bad = [r for r in rows if int(r['crash'])]
          if os.environ['HAS_CHECKSUM'] == 'yes':
              bad += [r for r in rows if int(r['undetected_silent'])]
          if bad:
              for r in bad:
                  print('FAIL', r)
              raise SystemExit(1)
          silent = sum(int(r['undetected_silent']) for r in rows)
          print('profile', rows[0]['profile'], 'ok;', silent, 'silent cases recorded')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrub-sweep-${{ matrix.preset }}
          path: scrub-sweep.csv

  # The shim, under load, for long enough that a slow leak or a rare
  # mis-classification would show. ci.yml runs each program once; this runs
  # them over and over and checks the heap after every single one, which is the
  # only way a fault that needs a particular arena shape to appear ever will.
  preload-soak:
    name: preload soak / ${{ matrix.preset }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-release, gcc-fast, gcc-paranoid]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)
      - name: Soak
        run: |
          set -e
          SO=$PWD/build/${{ matrix.preset }}/bin/libmars_preload.so
          LOG=$PWD/soak.log
          : > "$LOG"
          for i in $(seq 1 40); do
            export LD_PRELOAD=$SO MARS_SHIM_CHECK=$LOG
            git log --stat -n 60 > /dev/null
            python3 -c "d={str(j):j*j for j in range(150000)}; print(len(d))" > /dev/null
            gcc -O2 -std=c11 -c src/mm_core.c -Iinclude -Isrc -o /tmp/o.o
            ls -laR /usr/include > /dev/null
            unset LD_PRELOAD MARS_SHIM_CHECK
          done
          echo "consistent: $(grep -c 'heap consistent at exit' "$LOG")"
          echo "failed:     $(grep -c 'INCONSISTENT' "$LOG")"
          [ "$(grep -c 'INCONSISTENT' "$LOG")" = "0" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preload-soak-${{ matrix.preset }}
          path: soak.log

  valgrind-soak:
    name: soak / valgrind
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Configure
        run: cmake --preset gcc-debug
      - name: Build
        run: cmake --build --preset gcc-debug -- -j$(nproc)
      - name: Memcheck a long fuzz run
        run: |
          valgrind -q --error-exitcode=1 --leak-check=full \
                   ./build/gcc-debug/bin/fuzz_shadow --ops 200000
